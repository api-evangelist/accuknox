method: searched
source: >-
  Go module proxy (proxy.golang.org), the Terraform Registry API, npm registry, PyPI, and
  the accuknox GitHub organization.
note: >-
  AccuKnox publishes NO first-party language client SDK. npm, PyPI, RubyGems, Maven Central,
  NuGet and crates.io carry nothing under an accuknox name — every registry query returned
  404. What AccuKnox does ship is Go tooling (the knoxctl CLI), a Terraform provider, and
  CI/CD plugins distributed through the GitHub Actions Marketplace rather than a package
  registry. No `SDKs` pointer is emitted, because there is no client library to point at.
