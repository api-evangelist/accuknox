note: >-
  Every entry below cites where the evidence was read. Entries marked
  `evidence_level: contract` are visible in a machine-readable artifact AccuKnox publishes
  (a .proto, a documented payload shape, a live endpoint). Entries marked
  `evidence_level: documentation` are stated in AccuKnox's docs but cannot be checked
  against a contract, because AccuKnox publishes no OpenAPI. AccuKnox's /compliance page is
  a PRODUCT capability list — 33+ frameworks its platform scans customers against — and is
  NOT a statement that AccuKnox itself holds those certifications, so no `Compliance`
  pointer is emitted and no certification is asserted on AccuKnox's behalf.
