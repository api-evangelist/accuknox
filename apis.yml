aid: accuknox
name: AccuKnox
description: AccuKnox is a cloud-native application protection platform (CNAPP) vendor built on a Zero
  Trust model, covering cloud security posture management (CSPM), workload and Kubernetes runtime security
  (CWPP), application security posture management (ASPM), AI/ML model security (AI-SPM / ModelKnox) and
  API security. It originated the open source KubeArmor eBPF/LSM runtime enforcement engine (a CNCF project)
  and publishes the Discovery Engine and SentryFlow gRPC services, a knoxctl CLI, a Terraform provider,
  a first-party Model Context Protocol server, and a token-authenticated REST API on per-tenant cspm.*.accuknox.com
  hosts.
image: https://accuknox.com/wp-content/uploads/accuknox-logo-2.png
url: https://raw.githubusercontent.com/api-evangelist/accuknox/refs/heads/main/apis.yml
