apis:
- aid: accuknox:accuknox-saas-platform-api
  name: AccuKnox SaaS Platform API
  image: https://accuknox.com/wp-content/uploads/accuknox-logo-2.png
  description: Token-authenticated REST API behind the AccuKnox SaaS console, serving asset inventory,
    security findings, AI/ML model risk (ModelKnox) and tenant configuration under an /api/v1/ path prefix.
    Served per tenant on cspm.<tenant>.accuknox.com; the interactive Swagger/ReDoc surface at /api/swagger/
    and /api/redoc/ is behind a Django admin login, so no public machine-readable contract is published.
  humanURL: https://help.accuknox.com/integrations/oauth/
  baseURL: https://cspm.accuknox.com
  tags:
  - Security
  - Cloud Security
  - Findings
  - Asset Inventory
