  - type: ErrorCatalog
    url: errors/accuknox-error-codes.yml
- aid: accuknox:accuknox-discovery-engine
  name: AccuKnox Discovery Engine gRPC API
  image: https://accuknox.com/wp-content/uploads/accuknox-logo-2.png
  description: gRPC services for AccuKnox Discovery Engine (knoxAutoPolicy), which auto-discovers least-permissive
    network and system policies from observed workload behaviour. Nine published proto3 contracts covering
    policy analysis, configuration, consumer/worker control, observability summaries, insights, publishing
    and licensing. Self-hosted in-cluster; no public base URL is published.
  humanURL: https://github.com/accuknox/discovery-engine
  properties:
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-analyzer.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-config.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-consumer.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-discovery.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-insight.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-license.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-observability.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-publisher.proto
  - type: Protobuf
    url: grpc/accuknox-discovery-engine-worker.proto
  - type: SourceCode
    url: https://github.com/accuknox/discovery-engine
- aid: accuknox:accuknox-sentryflow
  name: AccuKnox SentryFlow API Observability gRPC API
  image: https://accuknox.com/wp-content/uploads/accuknox-logo-2.png
  description: gRPC services for SentryFlow, AccuKnox's API observability and classification component.
    Streams API access logs, API events and Envoy/API metrics from service mesh and ingress data planes,
    and classifies observed API endpoints. Self-hosted; no public base URL is published.
  humanURL: https://github.com/accuknox/SentryFlow
  properties:
  - type: Protobuf
    url: grpc/accuknox-sentryflow.proto
  - type: Protobuf
    url: grpc/accuknox-sentryflow-metrics.proto
  - type: SourceCode
    url: https://github.com/accuknox/SentryFlow
- aid: accuknox:accuknox-mcp-server
  name: AccuKnox MCP Server
  image: https://accuknox.com/wp-content/uploads/accuknox-logo-2.png
  description: First-party Model Context Protocol server published by AccuKnox that exposes the SaaS Platform
    API to agents as MCP tools for asset search, finding retrieval, finding filters and funnels, and AI/ML
    model vulnerability summaries. Distributed as source on GitHub and run locally over stdio (or self-hosted
    over streamable HTTP); AccuKnox operates no hosted remote MCP endpoint.
  humanURL: https://github.com/accuknox/mcp_server
  properties:
  - type: MCPServer
    url: mcp/accuknox-mcp.yml
  - type: SourceCode
    url: https://github.com/accuknox/mcp_server
