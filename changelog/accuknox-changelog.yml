  url: https://help.accuknox.com/getting-started/3.6-release/
  date: null
  breaking: none stated
  highlights:
  - Finding lifecycle automation — Active -> Waiting for Verification -> Fixed on confirmed remediation
  - Status logs recording who changed a finding status and when
  - SBOM license findings as a new finding type
  - AWS onboarding by CloudFormation role ARN, no stored access keys
  - Checks Management — enable/disable individual checks per account, adjust severity
  - Security Graph for asset relationships and attack paths
  - Microsoft 365 SSPM CIS benchmark scanning
  - AWS Service Control Policy builder; YAML policy import/export; bulk policy actions
  - Event Trail audit logging for certificates, cloud accounts, collectors, policies, registries
  - Ubuntu 22.04/24.04 STIG and CIS profiles; KubeArmor DNS enforcement, file integrity hashes, ECS Fargate
  - SAMA compliance framework for the Saudi financial sector
  - MFA-enabled DAST via browser recorder with TOTP
